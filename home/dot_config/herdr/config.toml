onboarding = false

# Right side of the tab row: zoom pill, hostname, server-local clock.
# WezTerm's own tab bar/status is hidden, so herdr provides the clock.
[ui]
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M:%S" },
]
tab_bar_right_separator = " · "
